name: 機能要望 (Feature Request)
description: 新しい機能やアイデアを提案・起票します
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案したい機能のアイデアや背景を記述してください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / 背景
      description: どのような問題や課題を解決したいか記述してください
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策 / 機能の詳細
      description: どのような機能やUIを想定しているか記述してください
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案（任意）
      description: 他に検討した方法があれば記述してください
    validations:
      required: false
