name: バグ報告 (Bug Report)
description: アプリの不具合やクラッシュを報告します
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        発生した不具合の詳細を記述してください。
  - type: textarea
    id: description
    attributes:
      label: 不具合の概要
      description: 何が起きたか簡潔に記述してください
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 不具合を再現するための手順を記述してください
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 本来どう動くべきだったか記述してください
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 動作環境
      placeholder: 例: Pixel 8 / Android 14 / Debug build
    validations:
      required: false
