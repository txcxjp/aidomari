name: CI

on:
  push:
    branches: [ main, 'v1.x', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, 'v1.x' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality (Spotless & Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Spotless Check
        run: gradle spotlessCheck --stacktrace

      - name: Run Android Lint
        run: gradle lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests
        run: gradle :shared-core:test :desktopApp:test testDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            shared-core/build/reports/tests/test/
            desktopApp/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build-apk:
    name: Build Debug APK
    needs: [code-quality, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aidomari-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-desktop-windows:
    name: Build Windows Desktop App
    needs: [code-quality, unit-test]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Windows Distributable
        run: gradle :desktopApp:createDistributable --stacktrace

      - name: Upload Windows Desktop Distributable
        uses: actions/upload-artifact@v4
        with:
          name: aidomari-windows-desktop
          path: desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
